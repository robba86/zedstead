[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zsm"
dynamic = ["version"]
description = "DayZ server management CLI + web UI"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "InquirerPy>=0.3",
    "requests>=2.32.4",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "watchfiles>=0.20",
    "websockets>=11.0",
    "berconpy>=3.0",
    "python-a2s>=1.3",
    "croniter>=6.0",
    "cron-descriptor>=1.4",
    "defusedxml>=0.7",
    "cryptography>=44.0",
]

[project.scripts]
zsm = "app.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*", "data/*.json", "data/*.md", "data/*.txt", "data/*.env", "web/static/*", "web/static/assets/*"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
